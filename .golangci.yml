version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  # Select linters explicitly so tool upgrades do not implicitly expand the rule set.
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    staticcheck:
      # Match standalone staticcheck v0.8.1 defaults; QF and the rules below are not enabled by default.
      checks:
        - all
        - '-QF*'
        - '-SA9003'
        - '-ST1000'
        - '-ST1003'
        - '-ST1016'
        - '-ST1020'
        - '-ST1021'
        - '-ST1022'
        - '-ST1023'
  exclusions:
    # Disable default issue exclusion presets; test files are checked as well.
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
