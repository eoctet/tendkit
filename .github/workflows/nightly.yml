name: nightly-platform

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      TENDKIT_PLATFORM_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go test ./internal/ui -run 'TestTUIPTY' -count=20
      - run: go test ./cmd/tendkit -run 'TestTUI' -count=10
