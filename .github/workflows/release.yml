name: release-smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o tendkit ./cmd/tendkit
      - run: go test ./cmd/tendkit -run 'TestTUI' -count=1
