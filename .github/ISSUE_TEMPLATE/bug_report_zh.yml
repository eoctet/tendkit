name: "🐛 错误报告（简体中文）"
description: 报告 TendKit 中可复现的问题
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 TendKit。提交前请先搜索已有 Issue。
        如果问题是尚未公开的安全漏洞，请停止填写并改为遵循 SECURITY_ZH_CN.md。

  - type: input
    id: version
    attributes:
      label: TendKit 版本
      description: 运行 `tendkit version`；如果从源码构建，请提供 commit SHA。
      placeholder: "0.1.0 或 commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - macOS
        - Ubuntu
        - Debian
        - CentOS
        - Red Hat Enterprise Linux
        - 其他或不受支持的系统
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: 架构
      options:
        - arm64
        - x86_64
        - 其他或未知
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？
      description: 描述实际行为和可见错误。不要包含凭据、令牌、加密密钥或未经脱敏的私有路径。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望 TendKit 如何处理？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供最小、确定性的操作序列，包括相关参数和脱敏后的配置字段。
      placeholder: |
        1. 使用 ... 启动 TendKit
        2. 打开 ...
        3. 按下 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 删除令牌、环境变量值、用户名、个人路径等敏感数据；截图请添加到问题描述中。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，未发现重复问题。
          required: true
        - label: 我已删除凭据、令牌、加密密钥和敏感的个人或系统信息。
          required: true
        - label: 本报告不涉及尚未公开的安全漏洞。
          required: true
