name: "🐛 Bug report"
description: Report a reproducible problem in TendKit
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TendKit. Search existing issues first.
        For an undisclosed vulnerability, stop here and follow SECURITY.md instead.

  - type: input
    id: version
    attributes:
      label: TendKit version
      description: Run `tendkit version`, or provide the commit SHA when building from source.
      placeholder: "0.1.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Ubuntu
        - Debian
        - CentOS
        - Red Hat Enterprise Linux
        - Other or unsupported
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - arm64
        - x86_64
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and any visible error. Do not include secrets or unredacted private paths.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect TendKit to do?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest deterministic sequence, including relevant flags and sanitized configuration fields.
      placeholder: |
        1. Start TendKit with ...
        2. Open ...
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Redact tokens, environment values, usernames, personal paths, and other sensitive data. Add screenshots to the problem description instead.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and sensitive personal or system information.
          required: true
        - label: This report does not describe an undisclosed security vulnerability.
          required: true
