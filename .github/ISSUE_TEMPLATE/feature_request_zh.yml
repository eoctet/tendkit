name: "🚀 功能建议（简体中文）"
description: 为 TendKit 提出聚焦的改进建议
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提出改进建议。提交前请搜索已有 Issue，并阅读文档中明确的产品边界。

  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 当前哪个流程存在困难、谁会遇到，以及现有能力为什么无法解决？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 描述你希望看到的最小用户可见结果，不必限定具体实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 描述现有变通方式或其他设计及其权衡。
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 范围与安全影响
      description: 说明涉及的平台、Provider、配置字段、命令、下载、权限或兼容性。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 添加经过脱敏的示例、草图或有助于理解请求的链接。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，未发现相同请求。
          required: true
        - label: 我已阅读 README 和相关公开产品文档。
          required: true
